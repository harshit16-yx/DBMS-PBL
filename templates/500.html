{% extends "base.html" %}

{% block title %}Server Error - Bus Reservation System{% endblock %}

{% block content %}
<div class="card" style="max-width: 650px; margin: 3rem auto; text-align: center;">
  <div class="card-body" style="padding: 3rem 2rem;">
    <h1 style="font-size: 3rem; color: #dc2626; margin-bottom: 0.5rem;">500</h1>
    <h2 style="margin-bottom: 1rem; color: var(--text-main);">Internal Server Error</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">An unexpected server error occurred.</p>
    {% if error %}
      <div class="alert alert-danger" style="text-align: left; font-family: monospace; font-size: 0.85rem;">
        {{ error }}
      </div>
    {% endif %}
    <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="margin-top: 1rem;">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
